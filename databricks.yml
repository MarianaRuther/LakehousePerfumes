# Rota do Perfume — ensaio pessoal da Noite 2 (engenharia de dados) da Imersão
# Jornada de Dados. O bundle nasce vazio neste prompt 1 e ganha uma camada por
# prompt até o fim da noite:
#
#   raw → bronze → silver → gold → dashboard → Genie
#
# Seis prompts, seis deploys. Deploy não é etapa de fim de projeto: é o que
# acontece toda vez que se termina algo.
#
# Databricks Free Edition: nada aqui pode exigir cluster clássico, só serverless.
bundle:
  name: rotaperfume_meu_ensaio
  uuid: c7ef0eee-fd51-4d41-8973-35a5d04e8c9e

include:
  - resources/*.yml

# catalog e warehouse_id em variável para o mesmo YAML funcionar em dev e prod
# sem editar uma linha sequer entre os dois deploys.
variables:
  catalog:
    description: Catálogo Unity Catalog onde vivem os schemas bronze, silver e gold
    default: lakehouse_rotaperfume
  warehouse_id:
    description: SQL Warehouse serverless que roda as tarefas SQL, o dashboard e o Genie
    default: bf043fb70747eb5f

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-5cf694fb-f9b7.cloud.databricks.com

    # ARMADILHA: de propósito NÃO usamos `mode: development` neste target.
    # Esse modo prefixa todo recurso deployado com "[dev seu_usuario]" —
    # inclusive os SCHEMAS do Unity Catalog que resources/catalogo.yml cria.
    # bronze/silver/gold virariam algo como "dev_marianaruther_bronze", e todo
    # o SQL da noite (que referencia <catalogo>.bronze, <catalogo>.silver, ...)
    # quebraria. Isso só se descobre errando, então fica registrado aqui.
    #
    # O que o mode: development também fazia — pausar o agendamento do job —
    # a gente faz na mão com este preset:
    presets:
      trigger_pause_status: PAUSED

  prod:
    mode: production
    workspace:
      host: https://dbc-5cf694fb-f9b7.cloud.databricks.com
      # Caminho fixo para garantir uma única cópia deployada em prod.
      root_path: /Workspace/Users/marianaruther@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: marianaruther@gmail.com
        level: CAN_MANAGE
