      catalog: lakehouse_rotaperfume
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-5cf694fb-f9b7.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/marianaruther@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/marianaruther@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lakehouse_rotaperfume
      schema: prod
    permissions:
      - user_name: marianaruther@gmail.com
        level: CAN_MANAGE
