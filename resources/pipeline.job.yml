# O job rotaperfume_pipeline — a espinha dorsal da noite 2.
#
# Ele nasce aqui com UMA tarefa e ganha as demais nos próximos cinco prompts,
# sempre na mesma ordem em que o dado é lido — nunca ao contrário:
#
#   prompt 1  raw_conferencia                                        (este)
#   prompt 2  + bronze_ingestao
#   prompt 3  + silver_clientes, silver_pedidos,
#               silver_itens_e_produtos, silver_crm_e_financeiro     (paralelo)
#   prompt 4  + gold_dimensoes → gold_fato_vendas → gold_marts
#             + testes_de_qualidade
#   prompt 6  + metricas_de_negocio → auditoria_de_metadado
#
# Desenho final do DAG:
#
#   raw_conferencia → bronze_ingestao → silver ×4 (paralelo) → gold_dimensoes
#     → gold_fato_vendas → gold_marts → testes_de_qualidade
#                                     → metricas_de_negocio → auditoria_de_metadado
#
# Tudo serverless (Free Edition não tem cluster clássico). Agendado às 6h da
# manhã — o dashboard comercial precisa estar com o dado do dia pronto antes
# do primeiro café da diretoria.

resources:
  jobs:
    rotaperfume_pipeline:
      name: rotaperfume_pipeline
      description: Pipeline medallion da Rota do Perfume — raw, bronze, silver e gold.

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo

      parameters:
        - name: catalog
          default: ${var.catalog}

      tasks:
        # A única tarefa deste prompt: os dez arquivos chegaram no Volume?
        - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
