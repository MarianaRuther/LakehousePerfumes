# O job rotaperfume_pipeline — a espinha dorsal da noite 2.
#
# Ele nasce aqui com UMA tarefa e ganha as demais nos próximos cinco prompts,
# sempre na mesma ordem em que o dado é lido — nunca ao contrário:
#
#   prompt 1  raw_conferencia
#   prompt 2  + bronze_ingestao
#   prompt 3  + silver_clientes, silver_pedidos,
#               silver_itens_e_produtos, silver_crm_e_financeiro
#   prompt 4  + gold_dimensoes → gold_fato_vendas → gold_marts
#             + testes_de_qualidade
#   prompt 6  + metricas_de_negocio → auditoria_de_metadado             (este)
#
# Desenho final do DAG:
#
#   raw_conferencia → bronze_ingestao → silver ×4 (paralelo) → gold_dimensoes
#     → gold_fato_vendas → gold_marts → testes_de_qualidade
#                                     → metricas_de_negocio → auditoria_de_metadado
#
# Tudo serverless (Free Edition não tem cluster clássico). Agendado às 6h da
# manhã — o dashboard comercial precisa estar com o dado do dia pronto antes
# do primeiro café da diretoria.

resources:
  jobs:
    rotaperfume_pipeline:
      name: rotaperfume_pipeline
      description: Pipeline medallion da Rota do Perfume — raw, bronze, silver e gold.

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo

      parameters:
        - name: catalog
          default: ${var.catalog}

      tasks:
        # A única tarefa do prompt 1: os dez arquivos chegaram no Volume?
        - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"

        # A tarefa do prompt anterior: os CSVs viram Delta, sujeira preservada.
        # depends_on é o conteúdo — se a conferência falhar, a bronze não roda.
        - task_key: bronze_ingestao
          depends_on:
            - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"

        # As quatro tarefas deste prompt: limpar, tipar e declarar o contrato.
        # Todas dependem só de bronze_ingestao — nenhuma depende da outra —
        # por isso rodam em paralelo, e é assim que o DAG desenha melhor.
        - task_key: silver_clientes
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/01-clientes.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_pedidos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/02-pedidos.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_itens_e_produtos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/03-itens-e-produtos.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_crm_e_financeiro
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/04-crm-e-financeiro.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        # As quatro dimensões conformadas: depende das QUATRO tarefas silver,
        # porque dim_cliente cruza clientes com pedidos e dim_produto/vendedor
        # vêm de tabelas espalhadas pelos quatro arquivos anteriores.
        - task_key: gold_dimensoes
          depends_on:
            - task_key: silver_clientes
            - task_key: silver_pedidos
            - task_key: silver_itens_e_produtos
            - task_key: silver_crm_e_financeiro
          sql_task:
            file:
              path: ../src/gold/05-dimensoes.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        # O fato junta com gold.dim_cliente (para razao_social/segmento/cidade
        # desnormalizados) — por isso depende das dimensões, não só da silver.
        - task_key: gold_fato_vendas
          depends_on:
            - task_key: gold_dimensoes
          sql_task:
            file:
              path: ../src/gold/06-fato-vendas.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        # Os três marts, um por diretoria, todos lendo o mesmo fato_vendas.
        - task_key: gold_marts
          depends_on:
            - task_key: gold_fato_vendas
          sql_task:
            file:
              path: ../src/gold/07-marts.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        # Os 9 testes de qualidade. Cada um levanta raise_error() se falhar, o
        # que derruba esta tarefa e o job inteiro — melhor o dashboard ficar
        # com o dado de ontem do que com o errado de hoje.
        - task_key: testes_de_qualidade
          depends_on:
            - task_key: gold_marts
          sql_task:
            file:
              path: ../src/gold/08-testes.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        # As views com nome de negócio, para o Genie encontrar a resposta sem
        # adivinhar JOIN. Roda em paralelo com testes_de_qualidade — as duas
        # dependem só de gold_marts, nenhuma depende da outra.
        - task_key: metricas_de_negocio
          depends_on:
            - task_key: gold_marts
          sql_task:
            file:
              path: ../src/gold/09-metricas-negocio.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        # A auditoria QUEBRA o job se alguma tabela ou coluna da gold estiver
        # sem COMMENT: metadado faltando é bug, não pendência de documentação
        # — é o texto que o Genie lê para decidir onde procurar.
        - task_key: auditoria_de_metadado
          depends_on:
            - task_key: metricas_de_negocio
          sql_task:
            file:
              path: ../src/gold/10-auditoria-metadado.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
